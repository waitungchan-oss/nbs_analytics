name: macOS Sandbox Integration

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  sandbox-capability-preflight:
    name: Required macOS sandbox capability
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run sandbox capability preflight
        run: >-
          python scripts/sandbox_capability_preflight.py
          --output .nbs_agent_runtime/sandbox-capability/evidence.json

      - name: Show sandbox capability evidence
        if: always()
        run: cat .nbs_agent_runtime/sandbox-capability/evidence.json

      - name: Run sandbox integration tests
        run: python -m pytest -m sandbox --sandbox-preflight required -q

      - name: Upload capability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-capability-evidence
          path: .nbs_agent_runtime/sandbox-capability/evidence.json
          if-no-files-found: error
