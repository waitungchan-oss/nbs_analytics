name: Release Gates

on:
  workflow_dispatch:
    inputs:
      enable_acceptance_shards:
        description: "Run the diagnostic acceptance shard canary"
        required: false
        default: false
        type: boolean
      enable_acceptance_performance_v2:
        description: "Upload opt-in contract and performance v2 diagnostics"
        required: false
        default: false
        type: boolean
      enable_acceptance_parallel_rollout:
        description: "Run the three-run parallel Full pytest diagnostic rollout"
        required: false
        default: false
        type: boolean
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    tags: ["v*", "release-*"]

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/tags/') == false }}

env:
  PYTHON_VERSION: "3.10"

jobs:
  full-pytest:
    name: Full pytest release gate
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch base branch for immutable evidence
        run: git fetch --no-tags origin main:refs/heads/main
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Create approved repository virtualenv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Prepare isolated full pytest fixture
        run: |
          SOURCE_FINGERPRINT=$(git archive --format=tar "$GITHUB_SHA" | shasum -a 256 | awk '{print $1}')
          .venv/bin/python scripts/prepare_release_gate_fixtures.py --output "$RUNNER_TEMP/nbs-full-pytest-fixture" --commit-sha "$GITHUB_SHA" --source-fingerprint "$SOURCE_FINGERPRINT" --timing-output "$RUNNER_TEMP/nbs-full-pytest-fixture/fixture-timing.json"
          echo "NBS_ANALYTICS_DB_FILE=$RUNNER_TEMP/nbs-full-pytest-fixture/release_gate_fixture.db" >> "$GITHUB_ENV"
          echo "NBS_ANALYTICS_CACHE_DIR=$RUNNER_TEMP/nbs-full-pytest-fixture/release_gate_cache" >> "$GITHUB_ENV"
          echo "NBS_ANALYTICS_COORDINATION_DB=$RUNNER_TEMP/nbs-full-pytest-fixture/upload_coordination.db" >> "$GITHUB_ENV"
      - name: Collect diagnostic pytest manifest
        run: |
          SOURCE_FINGERPRINT=$(git archive --format=tar "$GITHUB_SHA" | shasum -a 256 | awk '{print $1}')
          set +e
          .venv/bin/python scripts/pytest_manifest.py --project-root "$GITHUB_WORKSPACE" --commit-sha "$GITHUB_SHA" --source-fingerprint "$SOURCE_FINGERPRINT" --output pytest-manifest.json
          MANIFEST_EXIT=$?
          echo "pytest_manifest_exit=$MANIFEST_EXIT"
          exit 0
      - name: Run full pytest gate with required sandbox
        run: |
          SOURCE_FINGERPRINT=$(git archive --format=tar "$GITHUB_SHA" | shasum -a 256 | awk '{print $1}')
          .venv/bin/python scripts/full_pytest_gate.py --sandbox-preflight required --commit-sha "$GITHUB_SHA" --source-fingerprint "$SOURCE_FINGERPRINT" --output full-pytest.json
      - name: Ensure diagnostic timing artifact exists
        if: always()
        run: |
          SOURCE_FINGERPRINT=$(git archive --format=tar "$GITHUB_SHA" | shasum -a 256 | awk '{print $1}')
          if [ ! -s "$RUNNER_TEMP/nbs-full-pytest-fixture/fixture-timing.json" ]; then
            mkdir -p "$RUNNER_TEMP/nbs-full-pytest-fixture"
            .venv/bin/python - "$RUNNER_TEMP/nbs-full-pytest-fixture/fixture-timing.json" "$GITHUB_SHA" "$SOURCE_FINGERPRINT" <<'PY'
          import json
          import sys
          from pathlib import Path

          Path(sys.argv[1]).write_text(json.dumps({
              "schemaVersion": "acceptance-fixture-timing-unavailable-v1",
              "status": "BLOCKED",
              "commitSha": sys.argv[2],
              "sourceFingerprint": sys.argv[3],
          }) + "\n", encoding="utf-8")
          PY
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-pytest-manifest-${{ github.sha }}
          path: pytest-manifest.json
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-full-pytest-${{ github.sha }}
          path: full-pytest.json
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-full-pytest-timing-${{ github.sha }}
          path: ${{ runner.temp }}/nbs-full-pytest-fixture/fixture-timing.json
          if-no-files-found: error

  hermes:
    name: Hermes release gate
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch base branch for immutable evidence
        run: git fetch --no-tags origin main:refs/heads/main
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Create approved repository virtualenv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Prepare isolated Hermes baseline fixture
        run: |
          SOURCE_FINGERPRINT=$(git archive --format=tar "$GITHUB_SHA" | shasum -a 256 | awk '{print $1}')
          .venv/bin/python scripts/prepare_release_gate_fixtures.py --output "$RUNNER_TEMP/nbs-hermes-fixture" --source-fingerprint "$SOURCE_FINGERPRINT"
          echo "NBS_ANALYTICS_DB_FILE=$RUNNER_TEMP/nbs-hermes-fixture/release_gate_fixture.db" >> "$GITHUB_ENV"
          echo "NBS_ANALYTICS_CACHE_DIR=$RUNNER_TEMP/nbs-hermes-fixture/release_gate_cache" >> "$GITHUB_ENV"
          echo "NBS_ANALYTICS_COORDINATION_DB=$RUNNER_TEMP/nbs-hermes-fixture/upload_coordination.db" >> "$GITHUB_ENV"
      - name: Run Hermes read-only gate
        run: |
          SOURCE_FINGERPRINT=$(git archive --format=tar "$GITHUB_SHA" | shasum -a 256 | awk '{print $1}')
          .venv/bin/python scripts/hermes_gate.py --skip-system-acceptance --commit-sha "$GITHUB_SHA" --source-fingerprint "$SOURCE_FINGERPRINT" --output hermes.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-hermes-${{ github.sha }}
          path: hermes.json
          if-no-files-found: error

  ui-acceptance:
    name: UI acceptance release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch base branch for immutable evidence
        run: git fetch --no-tags origin main:refs/heads/main
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Create approved repository virtualenv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - run: .venv/bin/python -m playwright install --with-deps chromium
      - name: Prepare isolated HTTP fixture
        run: |
          SOURCE_FINGERPRINT=$(git archive --format=tar "$GITHUB_SHA" | shasum -a 256 | awk '{print $1}')
          .venv/bin/python scripts/prepare_release_gate_fixtures.py --profile ui --output "$RUNNER_TEMP/nbs-ui-fixture" --source-fingerprint "$SOURCE_FINGERPRINT"
          echo "NBS_ANALYTICS_DB_FILE=$RUNNER_TEMP/nbs-ui-fixture/release_gate_fixture.db" >> "$GITHUB_ENV"
          echo "NBS_ANALYTICS_CACHE_DIR=$RUNNER_TEMP/nbs-ui-fixture/release_gate_cache" >> "$GITHUB_ENV"
          echo "NBS_ANALYTICS_COORDINATION_DB=$RUNNER_TEMP/nbs-ui-fixture/upload_coordination.db" >> "$GITHUB_ENV"
          echo "NBS_ACCEPTANCE_SOURCE_FINGERPRINT=$SOURCE_FINGERPRINT" >> "$GITHUB_ENV"
      - name: Run isolated HTTP UI acceptance
        run: |
          .venv/bin/python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8765 > "$RUNNER_TEMP/ui-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ui-server.pid"
          trap 'kill "$(cat "$RUNNER_TEMP/ui-server.pid")" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8765/ > "$RUNNER_TEMP/ui-page.html"
          SOURCE_FINGERPRINT="$NBS_ACCEPTANCE_SOURCE_FINGERPRINT"
          export NBS_ACCEPTANCE_SOURCE_FINGERPRINT="$SOURCE_FINGERPRINT"
          .venv/bin/python scripts/streamlit_ui_smoke.py --project-root "$GITHUB_WORKSPACE" --route http://127.0.0.1:8765/ --served-url http://127.0.0.1:8765/ --commit-sha "$GITHUB_SHA" --source-fingerprint "$SOURCE_FINGERPRINT" --output "$RUNNER_TEMP/nbs-ui-fixture/evidence.json"
          .venv/bin/python scripts/ui_acceptance_gate.py --url http://127.0.0.1:8765/ --fixture-root "$RUNNER_TEMP/nbs-ui-fixture" --evidence "$RUNNER_TEMP/nbs-ui-fixture/evidence.json" --commit-sha "$GITHUB_SHA" --source-fingerprint "$SOURCE_FINGERPRINT" --output ui-acceptance.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-ui-acceptance-${{ github.sha }}
          path: ui-acceptance.json
          if-no-files-found: error

  acceptance-shard-preflight:
    name: acceptance-shard-preflight
    if: github.event_name == 'workflow_dispatch' && inputs.enable_acceptance_shards == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Create isolated shard preflight environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Collect source-bound shard manifest
        run: |
          SOURCE_FINGERPRINT=$(git archive --format=tar "$GITHUB_SHA" | shasum -a 256 | awk '{print $1}')
          mkdir -p "$RUNNER_TEMP/nbs-shard-preflight"
          .venv/bin/python scripts/pytest_manifest.py --project-root "$GITHUB_WORKSPACE" --commit-sha "$GITHUB_SHA" --source-fingerprint "$SOURCE_FINGERPRINT" --output "$RUNNER_TEMP/nbs-shard-preflight/pytest-manifest.json"
          test -s "$RUNNER_TEMP/nbs-shard-preflight/pytest-manifest.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-shard-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/nbs-shard-preflight/pytest-manifest.json
          if-no-files-found: warn

  acceptance-shard-canary:
    name: acceptance-shard-canary
    if: always() && github.event_name == 'workflow_dispatch' && inputs.enable_acceptance_shards == true && needs.acceptance-shard-preflight.result == 'success'
    needs: [acceptance-shard-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Create isolated shard canary environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: acceptance-shard-preflight-${{ github.sha }}
          path: artifacts/shard-preflight
      - name: Run repeated diagnostic shard canary
        run: |
          SOURCE_FINGERPRINT=$(git archive --format=tar "$GITHUB_SHA" | shasum -a 256 | awk '{print $1}')
          NBS_ACCEPTANCE_COMMIT_SHA="$GITHUB_SHA" NBS_ACCEPTANCE_SOURCE_FINGERPRINT="$SOURCE_FINGERPRINT" ACCEPTANCE_SHARDS_ENABLED=true .venv/bin/python scripts/acceptance_shard_canary.py --project-root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/shard-canary.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-shard-canary-${{ github.sha }}
          path: ${{ runner.temp }}/shard-canary.json
          if-no-files-found: warn

  acceptance-shard-aggregate:
    name: acceptance-shard-aggregate
    if: always() && github.event_name == 'workflow_dispatch' && inputs.enable_acceptance_shards == true
    needs: [acceptance-shard-preflight, acceptance-shard-canary]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: acceptance-shard-preflight-${{ github.sha }}
          path: artifacts/shard-preflight
      - uses: actions/download-artifact@v4
        with:
          name: acceptance-shard-canary-${{ github.sha }}
          path: artifacts/shard-canary
      - name: Require successful advisory upstream jobs
        if: always()
        run: |
          test "${{ needs.acceptance-shard-preflight.result }}" = "success"
          test "${{ needs.acceptance-shard-canary.result }}" = "success"
      - name: Validate advisory canary artifact
        if: always()
        run: |
          test -s artifacts/shard-preflight/pytest-manifest.json
          test -s artifacts/shard-canary/shard-canary.json
          python - <<'PY'
          import json
          manifest = json.load(open("artifacts/shard-preflight/pytest-manifest.json", encoding="utf-8"))
          canary = json.load(open("artifacts/shard-canary/shard-canary.json", encoding="utf-8"))
          assert manifest["commitSha"] == "${{ github.sha }}"
          assert canary["commitSha"] == manifest["commitSha"]
          assert canary["sourceFingerprint"] == manifest["sourceFingerprint"]
          assert canary["manifestFingerprint"] == manifest["manifestFingerprint"]
          assert canary["schemaVersion"] == "acceptance-shard-canary-v1"
          assert canary["rolloutCandidate"] in {"eligible", "ineligible"}
          assert canary["status"] in {"PASS", "BLOCKED"}
          assert canary["formalReleaseEnabled"] is False
          PY

  acceptance-parallel-rollout:
    name: acceptance-parallel-rollout
    # Diagnostic-only and manual by design; artifact formalReleaseEnabled=false. Roll back with:
    # gh workflow run release-gates.yml -f enable_acceptance_parallel_rollout=false
    if: github.event_name == 'workflow_dispatch' && inputs.enable_acceptance_parallel_rollout == true
    runs-on: macos-14
    # Three runs may each consume one serial and one parallel 1800s budget.
    # Keep a bounded 240-minute controller budget so legal evidence is not
    # truncated before the diagnostic artifact is emitted.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Create isolated parallel rollout environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Collect source-bound contract and manifest
        run: |
          ROLLOUT_ROOT="$RUNNER_TEMP/nbs-acceptance-parallel-rollout"
          ROLLOUT_SESSIONS="$ROLLOUT_ROOT/verification_sessions"
          mkdir -p "$ROLLOUT_SESSIONS"
          BASE_SHA=$(git merge-base "$GITHUB_SHA" "origin/main")
          test -n "$BASE_SHA"
          SEAL_OUTPUT=$(.venv/bin/python scripts/verification_chain.py seal --project-root "$GITHUB_WORKSPACE" --runtime-root "$ROLLOUT_SESSIONS" --brief docs/agents/ACCEPTANCE_PARALLEL_ROLLOUT_RUNBOOK.md --base "$BASE_SHA")
          printf '%s\n' "$SEAL_OUTPUT" > "$ROLLOUT_ROOT/source-seal-result.json"
          SESSION_ID=$(printf '%s' "$SEAL_OUTPUT" | .venv/bin/python -c 'import json, sys; print(json.load(sys.stdin)["sessionId"])')
          SOURCE_FINGERPRINT=$(printf '%s' "$SEAL_OUTPUT" | .venv/bin/python -c 'import json, sys; print(json.load(sys.stdin)["sourceFingerprint"])')
          SOURCE_SESSION_PATH="$ROLLOUT_SESSIONS/$SESSION_ID/session.json"
          SOURCE_SEAL_PATH="$ROLLOUT_ROOT/source-seal.json"
          test -s "$SOURCE_SESSION_PATH"
          .venv/bin/python - "$SOURCE_SESSION_PATH" "$SOURCE_SEAL_PATH" "$SOURCE_FINGERPRINT" <<'PY'
          import json
          import sys
          from pathlib import Path
          from scripts.acceptance_parallel_rollout import (
              _SOURCE_SESSION_FIELDS,
              _normalized_source_session,
              _valid_source_session,
          )

          session_path, seal_path = map(Path, sys.argv[1:3])
          source_fingerprint = sys.argv[3]
          expected_session = json.loads(session_path.read_text(encoding="utf-8"))
          expected = _normalized_source_session(expected_session)
          if expected["sourceFingerprint"] != source_fingerprint:
              raise SystemExit("source fingerprint does not match the canonical verification session")
          source_seal = {
              "schemaVersion": "source-seal-v1",
              **{field: expected[field] for field in _SOURCE_SESSION_FIELDS},
          }
          actual = _normalized_source_session(source_seal)
          if not _valid_source_session(source_seal) or any(
              actual.get(field) != expected.get(field) for field in _SOURCE_SESSION_FIELDS
          ):
              raise SystemExit("generated source seal does not match the canonical verification session")
          seal_path.write_text(json.dumps(source_seal, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          test -s "$SOURCE_SEAL_PATH"
          SCOPE_FINGERPRINT=$(printf '%s' 'nbs-acceptance|formal-scope-v1|不含掛賬核銷與TT退款轉團款' | shasum -a 256 | awk '{print $1}')
          SEMANTIC_RULES_FINGERPRINT=$(printf '%s' 'acceptance-semantic-rules-v1' | shasum -a 256 | awk '{print $1}')
          DATASET_SNAPSHOT_FINGERPRINT=$(printf '%s' 'release-gate-ci-fixture|dataset-snapshot-v1' | shasum -a 256 | awk '{print $1}')
          RUNTIME_FINGERPRINTS=$(.venv/bin/python -c 'import json,sys; from backend.agents.acceptance_parallel_runner import observe_runtime_fingerprints; print(json.dumps(observe_runtime_fingerprints(sys.argv[1]),sort_keys=True))' "$GITHUB_WORKSPACE")
          RUNNER_FINGERPRINT=$(printf '%s' "$RUNTIME_FINGERPRINTS" | .venv/bin/python -c 'import json,sys; print(json.load(sys.stdin)["runnerFingerprint"])')
          ENVIRONMENT_FINGERPRINT=$(printf '%s' "$RUNTIME_FINGERPRINTS" | .venv/bin/python -c 'import json,sys; print(json.load(sys.stdin)["environmentFingerprint"])')
          mkdir -p "$RUNNER_TEMP/nbs-acceptance-parallel-rollout"
          .venv/bin/python scripts/acceptance_baseline.py contract --contract-id nbs-acceptance --contract-version formal-scope-v1 --scope-fingerprint "$SCOPE_FINGERPRINT" --semantic-rules-fingerprint "$SEMANTIC_RULES_FINGERPRINT" --dataset-snapshot-fingerprint "$DATASET_SNAPSHOT_FINGERPRINT" --output "$RUNNER_TEMP/nbs-acceptance-parallel-rollout/contract.json"
          .venv/bin/python scripts/pytest_manifest.py --project-root "$GITHUB_WORKSPACE" --commit-sha "$GITHUB_SHA" --source-fingerprint "$SOURCE_FINGERPRINT" --output "$RUNNER_TEMP/nbs-acceptance-parallel-rollout/pytest-manifest.json"
          {
            echo "SOURCE_FINGERPRINT=$SOURCE_FINGERPRINT"
            echo "SOURCE_SESSION_PATH=$SOURCE_SESSION_PATH"
            echo "SOURCE_SEAL_PATH=$SOURCE_SEAL_PATH"
            echo "RUNNER_FINGERPRINT=$RUNNER_FINGERPRINT"
            echo "ENVIRONMENT_FINGERPRINT=$ENVIRONMENT_FINGERPRINT"
          } >> "$GITHUB_ENV"
      - name: Run three-run parallel diagnostic rollout
        run: |
          SHARD_COUNT=$(.venv/bin/python -c 'import os; n=len(os.sched_getaffinity(0)) if hasattr(os, "sched_getaffinity") else (os.cpu_count() or 1); print(4 if n >= 4 else 2)')
          .venv/bin/python scripts/acceptance_parallel_rollout.py --project-root "$GITHUB_WORKSPACE" --manifest "$RUNNER_TEMP/nbs-acceptance-parallel-rollout/pytest-manifest.json" --contract "$RUNNER_TEMP/nbs-acceptance-parallel-rollout/contract.json" --commit-sha "$GITHUB_SHA" --source-fingerprint "$SOURCE_FINGERPRINT" --runner-fingerprint "$RUNNER_FINGERPRINT" --environment-fingerprint "$ENVIRONMENT_FINGERPRINT" --baseline-family-id acceptance-full-serial-ci-v1 --shard-count "$SHARD_COUNT" --repeats 3 --timeout 1800 --source-seal "$SOURCE_SEAL_PATH" --source-session "$SOURCE_SESSION_PATH" --output "$RUNNER_TEMP/nbs-acceptance-parallel-rollout/acceptance-parallel-rollout.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-parallel-rollout-${{ github.sha }}
          path: ${{ runner.temp }}/nbs-acceptance-parallel-rollout/
          if-no-files-found: warn

  aggregate:
    name: Release gate aggregate
    if: always()
    runs-on: ubuntu-latest
    needs: [full-pytest, hermes, ui-acceptance]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch base branch for immutable evidence
        run: git fetch --no-tags origin main:refs/heads/main
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: release-gate-full-pytest-${{ github.sha }}
          path: artifacts/full-pytest
      - uses: actions/download-artifact@v4
        with:
          name: release-gate-pytest-manifest-${{ github.sha }}
          path: artifacts/pytest-manifest
      - uses: actions/download-artifact@v4
        with:
          name: release-gate-full-pytest-timing-${{ github.sha }}
          path: artifacts/full-pytest-timing
      - uses: actions/download-artifact@v4
        with:
          name: release-gate-hermes-${{ github.sha }}
          path: artifacts/hermes
      - uses: actions/download-artifact@v4
        with:
          name: release-gate-ui-acceptance-${{ github.sha }}
          path: artifacts/ui-acceptance
      - name: Aggregate fresh release evidence
        run: |
          SOURCE_FINGERPRINT=$(git archive --format=tar "$GITHUB_SHA" | shasum -a 256 | awk '{print $1}')
          python scripts/release_gate.py aggregate --full-pytest artifacts/full-pytest/full-pytest.json --hermes artifacts/hermes/hermes.json --ui-acceptance artifacts/ui-acceptance/ui-acceptance.json --commit-sha "$GITHUB_SHA" --source-fingerprint "$SOURCE_FINGERPRINT" --output release-gate-result.json
      - name: Compose diagnostic acceptance performance artifact
        if: always()
        run: |
          SOURCE_FINGERPRINT=$(git archive --format=tar "$GITHUB_SHA" | shasum -a 256 | awk '{print $1}')
          RUNNER_FINGERPRINT=$(python -c 'import hashlib, platform, sys; requirements = hashlib.sha256(open("requirements.txt", "rb").read()).hexdigest(); raw = f"{platform.system()}|{platform.machine()}|{sys.version_info[:3]}|{requirements}"; print(hashlib.sha256(raw.encode("utf-8")).hexdigest())')
          set +e
          python scripts/acceptance_performance_benchmark.py --manifest artifacts/pytest-manifest/pytest-manifest.json --full-pytest artifacts/full-pytest/full-pytest.json --fixture-timing artifacts/full-pytest-timing/fixture-timing.json --aggregate release-gate-result.json --commit-sha "$GITHUB_SHA" --source-fingerprint "$SOURCE_FINGERPRINT" --runner-fingerprint "$RUNNER_FINGERPRINT" --selection-mode full --output .nbs_agent_runtime/acceptance-optimization/ci-performance.json
          PERFORMANCE_EXIT=$?
          echo "acceptance_performance_exit=$PERFORMANCE_EXIT"
          exit 0
      - name: Compose opt-in acceptance contract and performance v2 diagnostics
        if: always() && github.event_name == 'workflow_dispatch' && inputs.enable_acceptance_performance_v2 == true
        run: |
          SOURCE_FINGERPRINT=$(git archive --format=tar "$GITHUB_SHA" | shasum -a 256 | awk '{print $1}')
          SCOPE_FINGERPRINT=$(printf '%s' 'nbs-acceptance|formal-scope-v1|不含掛賬核銷與TT退款轉團款' | shasum -a 256 | awk '{print $1}')
          SEMANTIC_RULES_FINGERPRINT=$(printf '%s' 'acceptance-semantic-rules-v1' | shasum -a 256 | awk '{print $1}')
          DATASET_SNAPSHOT_FINGERPRINT=$(printf '%s' 'release-gate-ci-fixture|dataset-snapshot-v1' | shasum -a 256 | awk '{print $1}')
          RUNNER_FINGERPRINT=$(python -c 'import hashlib, platform, sys; requirements = hashlib.sha256(open("requirements.txt", "rb").read()).hexdigest(); raw = f"{platform.system()}|{platform.machine()}|{sys.version_info[:3]}|{requirements}"; print(hashlib.sha256(raw.encode("utf-8")).hexdigest())')
          ENVIRONMENT_FINGERPRINT=$(python -c 'import hashlib, platform, sys; raw = f"{platform.system()}|{platform.machine()}|{sys.version_info[:3]}|release-gate-aggregate-v1"; print(hashlib.sha256(raw.encode("utf-8")).hexdigest())')
          mkdir -p .nbs_agent_runtime/acceptance-baseline-v2
          set +e
          python scripts/acceptance_baseline.py contract --contract-id nbs-acceptance --contract-version formal-scope-v1 --scope-fingerprint "$SCOPE_FINGERPRINT" --semantic-rules-fingerprint "$SEMANTIC_RULES_FINGERPRINT" --dataset-snapshot-fingerprint "$DATASET_SNAPSHOT_FINGERPRINT" --output .nbs_agent_runtime/acceptance-baseline-v2/contract.json
          CONTRACT_EXIT=$?
          if [ "$CONTRACT_EXIT" -eq 0 ]; then
            python scripts/acceptance_performance_benchmark.py --manifest artifacts/pytest-manifest/pytest-manifest.json --full-pytest artifacts/full-pytest/full-pytest.json --fixture-timing artifacts/full-pytest-timing/fixture-timing.json --aggregate release-gate-result.json --commit-sha "$GITHUB_SHA" --source-fingerprint "$SOURCE_FINGERPRINT" --runner-fingerprint "$RUNNER_FINGERPRINT" --selection-mode full --contract .nbs_agent_runtime/acceptance-baseline-v2/contract.json --output-schema v2 --environment-fingerprint "$ENVIRONMENT_FINGERPRINT" --baseline-family-id acceptance-full-serial-ci-v1 --baseline-role serial_control --lifecycle draft --output .nbs_agent_runtime/acceptance-baseline-v2/performance-v2.json
          fi
          echo "acceptance_contract_exit=$CONTRACT_EXIT"
          exit 0
      - if: always() && github.event_name == 'workflow_dispatch' && inputs.enable_acceptance_performance_v2 == true
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-contract-${{ github.sha }}
          path: .nbs_agent_runtime/acceptance-baseline-v2/contract.json
          if-no-files-found: warn
      - if: always() && github.event_name == 'workflow_dispatch' && inputs.enable_acceptance_performance_v2 == true
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-performance-v2-${{ github.sha }}
          path: .nbs_agent_runtime/acceptance-baseline-v2/performance-v2.json
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-performance-${{ github.sha }}
          path: .nbs_agent_runtime/acceptance-optimization/ci-performance.json
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-aggregate
          path: release-gate-result.json
          if-no-files-found: error
